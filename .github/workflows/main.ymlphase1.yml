name: Phase 1 Swift Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  phase1:
    name: Build and Test QasatiDomain
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
